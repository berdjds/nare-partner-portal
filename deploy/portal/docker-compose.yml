# Reference copy of the live production layout on the owner's server
# (/opt/stack/docker-compose.yml, portal.nare.am). Kept in the repo so the
# provisioning script and the staging project stay in sync with production.
# This file is documentation of the live layout — the provisioning script
# never rewrites the live compose file. Secrets stay on the server and appear
# here only as ${VAR} placeholders.
#
# /opt/stack/.env contract: the `env_file:` below passes the file RAW to the
# container (no name mapping), so it must define the app's UNPREFIXED runtime
# variables — NEXTAUTH_SECRET, NEXTAUTH_URL, ADMIN_EMAIL, ADMIN_PASSWORD,
# DATABASE_URL, SMTP_* — and additionally the PORTAL_* names that the deploy
# gate's trial containers interpolate from the same file
# (PORTAL_NEXTAUTH_SECRET, PORTAL_ADMIN_EMAIL, PORTAL_ADMIN_PASSWORD; see
# scripts/vps-deploy.sh), plus PORTAL_IMAGE_TAG=latest (the deploy gate moves
# that tag at cutover).
services:
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - portal_net

  portal:
    build: ./portal/src
    # Safe default: a missing PORTAL_IMAGE_TAG must never produce the invalid
    # image reference `portal:` at cutover.
    image: portal:${PORTAL_IMAGE_TAG:-latest}
    container_name: portal-app
    env_file: /opt/stack/.env
    volumes:
      - ./portal/data:/app/data
      - ./portal/uploads:/app/public/uploads
      - ./portal/auth:/app/.wwebjs_auth
    networks:
      - portal_net

networks:
  # Compose project default network; its real name (<project>_portal_net) is
  # discovered at provisioning time, never hard-coded.
  portal_net:

volumes:
  caddy_data:
  caddy_config:
