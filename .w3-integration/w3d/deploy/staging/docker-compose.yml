# Staging project for portal.nare.am (phase W3).
#
# Runs on the owner's server alongside production with its own data folders
# under /opt/stack/staging and its own container (portal-staging). It joins
# the existing production Docker network as an external network named by
# PORTAL_NETWORK (discovered from the portal-app container by
# deploy/provision-server.sh, never hard-coded) so the live caddy container
# can reverse proxy staging.portal.nare.am to portal-staging:3000.
# WhatsApp automation is disabled in staging (WHATSAPP_DISABLED=1).
services:
  portal-staging:
    build: ${PORTAL_STAGING_SRC:-/opt/stack/portal/src}
    image: portal:staging
    container_name: portal-staging
    restart: unless-stopped
    env_file: /opt/stack/staging/.env
    environment:
      WHATSAPP_DISABLED: "1"
    volumes:
      - /opt/stack/staging/data:/app/data
      - /opt/stack/staging/uploads:/app/public/uploads
      - /opt/stack/staging/auth:/app/.wwebjs_auth
    networks:
      - portal

networks:
  portal:
    # The live production network (the compose project's default network for
    # portal_net); created and owned by the production project.
    external: true
    name: ${PORTAL_NETWORK:?PORTAL_NETWORK must name the production network (run deploy/provision-server.sh first)}
