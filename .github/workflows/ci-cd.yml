name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Serialize deployments: never run two VPS deploys concurrently.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || 'deploy-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    env:
      # CI does not need a browser binary: the PDF smoke test skips cleanly
      # without one, and skipping the ~150MB Chromium download keeps npm ci fast.
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --ignore-scripts: dependency postinstalls (puppeteer's browser
      # download) hang on the hosted runners. Prisma's own postinstall is
      # replaced by the explicit generate below; sharp/bcryptjs need none.
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - name: Unit and integration tests
        # DB-backed suites push the Prisma schema to throwaway /tmp SQLite files.
        run: npx vitest run
      - run: npm run build

  deploy:
    name: Deploy to VPS
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Package source
        run: |
          # Write outside the checkout: archiving "." while creating the
          # tarball inside it makes GNU tar fail with "file changed as we
          # read it".
          tar \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.git' \
            --exclude='.wwebjs_auth' \
            --exclude='.wwebjs_cache' \
            --exclude='public/uploads' \
            --exclude='prisma/dev.db' \
            --exclude='data/documents' \
            --exclude='*.tar.gz' \
            --exclude='*.db-journal' \
            -czf "$RUNNER_TEMP/wacontrol-source.tar.gz" .
          du -h "$RUNNER_TEMP/wacontrol-source.tar.gz"

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${VPS_HOST}" >> ~/.ssh/known_hosts

      - name: Upload source
        run: scp -i ~/.ssh/deploy_key "$RUNNER_TEMP/wacontrol-source.tar.gz" "${VPS_USER}@${VPS_HOST}:/tmp/wacontrol-source.tar.gz"

      - name: Run deploy gate on VPS
        # scripts/vps-deploy.sh ships inside the source tarball, so the VPS
        # always runs the deploy gate that matches the candidate: build while
        # the app serves, tag previous, assert exclusive data mounts, write
        # freeze, verified backup, trial A (candidate on a data copy), trial B
        # (rollback compatibility), cutover, then rollback or the manual
        # recovery procedure on post-cutover failure. The script is piped to
        # bash over ssh stdin; every `docker ... exec` inside it is guarded
        # with `< /dev/null` so nothing swallows the remaining script.
        run: |
          ssh -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}" \
            'WACONTROL_SOURCE_TARBALL=/tmp/wacontrol-source.tar.gz bash -s' \
            < scripts/vps-deploy.sh

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://wa.hayk.ae/login || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "Site did not return 200 on /login"
          exit 1
