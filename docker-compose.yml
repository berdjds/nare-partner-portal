# DEVELOPMENT ONLY — local all-in-one compose file.
#
# This file is NOT used by the production server. Production
# (https://portal.nare.am) runs from /opt/stack/docker-compose.yml (caddy +
# portal, TLS terminated by Caddy), which the owner installs once during
# provisioning from deploy/portal/docker-compose.yml and which deploys NEVER
# overwrite. Staging (https://staging.portal.nare.am) is a second compose
# project, deployed from deploy/staging/docker-compose.yml. Releases are
# driven by CI through the restricted deploy user — see doc/deployment.md.
#
# Local use:
#   docker compose up --build
# then open http://localhost:3000 and sign in with the ADMIN_EMAIL /
# ADMIN_PASSWORD values interpolated from the environment below.

services:
  wacontrol_app:
    build: .
    image: wacontrol:latest
    container_name: wacontrol-dev
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=file:/app/data/dev.db
      - NEXTAUTH_URL=${WACONTROL_NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${WACONTROL_NEXTAUTH_SECRET:?set WACONTROL_NEXTAUTH_SECRET in .env}
      - ADMIN_EMAIL=${WACONTROL_ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${WACONTROL_ADMIN_PASSWORD:?set WACONTROL_ADMIN_PASSWORD in .env}
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      # Travel module email notifications (optional; unset = deliveries flagged FAILED)
      - SMTP_HOST=${WACONTROL_SMTP_HOST:-}
      - SMTP_PORT=${WACONTROL_SMTP_PORT:-}
      - SMTP_USER=${WACONTROL_SMTP_USER:-}
      - SMTP_PASS=${WACONTROL_SMTP_PASS:-}
      - SMTP_FROM=${WACONTROL_SMTP_FROM:-}
    volumes:
      - ./wacontrol-data:/app/data
      - ./wacontrol-uploads:/app/public/uploads
      - ./wacontrol-auth:/app/.wwebjs_auth
    # No reverse proxy locally: the app is published straight on localhost.
    # Production TLS and host routing live in deploy/portal/Caddyfile.example.
    ports:
      - "127.0.0.1:3000:3000"
